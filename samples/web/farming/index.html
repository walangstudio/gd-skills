<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tile Farmer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161c; color: #e6e6e6;
      font-family: system-ui, sans-serif; display: grid; place-items: center; }
    #hud { position: fixed; top: 12px; left: 12px; font-size: 15px; line-height: 1.5; }
    #help { position: fixed; bottom: 12px; left: 12px; font-size: 13px; color: #9aa3b2; }
    canvas { background: #1d2330; border-radius: 8px; box-shadow: 0 6px 24px #0008; }
    b { color: #ffe066; }
  </style>
</head>
<body>
  <div id="hud">
    Gold: <span id="gold">0</span> / 100 &nbsp;|&nbsp; Day <span id="day">1</span><br />
    Seeds: <span id="seeds"></span><br />
    Selected crop: <b id="sel">carrot</b>
  </div>
  <canvas id="game" width="480" height="320"></canvas>
  <div id="help">
    Arrows move &nbsp; <b>T</b>ill &nbsp; <b>P</b>lant &nbsp; <b>W</b>ater &nbsp; <b>H</b>arvest &nbsp;
    <b>B</b>uy seed &nbsp; <b>N</b>ext day &nbsp; <b>1/2/3</b> pick crop &nbsp; <b>R</b>estart
  </div>
  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
